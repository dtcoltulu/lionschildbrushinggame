name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Ödeme Takvimi (odeme-takvimi/): Google Apps Script; testler sahte Google servisleriyle, bağımlılıksız.
  odeme-takvimi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odeme-takvimi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run mutasyon
