name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Klinik cihaz takip uygulaması (bağımsız klasör: cihaz-takip/)
  cihaz-takip:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cihaz-takip
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cihaz-takip/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Birim ve entegrasyon testleri (PGlite)
        run: npm test
      - name: Aynı testler gerçek PostgreSQL 16'ya karşı
        run: npm test -- --no-file-parallelism
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Geçiş betiği gerçek PostgreSQL'de iki kez çalışır (ikincisi değişiklik yapmaz)
        run: npm run db:migrate && npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
